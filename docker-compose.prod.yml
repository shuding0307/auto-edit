# 단일 VM 배포: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 외부에 열리는 포트는 Caddy의 80/443 뿐이다.
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://cut:${POSTGRES_PASSWORD:?}@postgres:5432/cut
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://s3:8333
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_URL:-https://${S3_DOMAIN:?}}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    S3_BUCKET: cut-editor
    WEB_ORIGIN: ${APP_URL:-https://${APP_DOMAIN:?}}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cut
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cut"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    # 키를 환경변수에서 받아 설정 파일을 만든 뒤 실행 (로컬용 infra/seaweedfs/s3.json 대신)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data

  api:
    <<: *backend
    command: ["sh", "-c", "cd apps/api && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]

  worker:
    <<: *backend
    command: ["rq", "worker", "cut", "--url", "redis://redis:6379/0"]

  # 1시간마다: 멈춘 job 복구 + 7일 지난 프로젝트 삭제
  maintenance:
    <<: *backend
    command: ["sh", "-c", "while true; do python scripts/maintenance.py; sleep 3600; done"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      # 운영은 80/443. 로컬 시험에서 80이 이미 쓰이면 HTTP_PORT/HTTPS_PORT로 바꾼다
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web, s3]

volumes:
  pgdata:
  s3data:
  caddy_data:
